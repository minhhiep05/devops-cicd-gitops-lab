apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web-app-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: web-app
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: web-app-metrics
    path: /metrics
    interval: 15s
