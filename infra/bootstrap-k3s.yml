---
- name: Bootstrap K3s Cluster & Helm on Target Server
  hosts: k8s_nodes
  become: yes
  vars:
    target_private_ip: "10.32.1.4" 

  tasks:
    - name: Cài đặt K3s Lightweight Kubernetes
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Đợi K3s khởi động hoàn toàn (file kubeconfig xuất hiện)
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 120

    - name: Đợi K3s API sẵn sàng nhận request
      shell: k3s kubectl get nodes
      register: k3s_ready
      until: k3s_ready.rc == 0
      retries: 10
      delay: 5
      changed_when: false

    - name: Tạo thư mục ~/.kube cho user ubuntu
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Copy kubeconfig vào ~/.kube/config cho user ubuntu
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Đảm bảo /etc/rancher/k3s/k3s.yaml cũng đọc được
      file:
        path: /etc/rancher/k3s/k3s.yaml
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Cài đặt Helm CLI
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Fetch kubeconfig về Management Server
      fetch:
        src: /home/ubuntu/.kube/config
        dest: /home/ubuntu/ansible/fetched-kubeconfig/{{ inventory_hostname }}-k3s.yaml
        flat: yes

    - name: Đổi 127.0.0.1 thành IP Private của Target Server trong bản kubeconfig đã fetch
      delegate_to: localhost
      become: no
      replace:
        path: /home/ubuntu/ansible/fetched-kubeconfig/{{ inventory_hostname }}-k3s.yaml
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ target_private_ip }}:6443"
